---
- name: Deploy package check to existing Zabbix agents
  hosts: all
  become: true

  vars:
    zabbix_server_ip: ""
    zabbix_agent_service: zabbix-agent
    zabbix_agent_config: /etc/zabbix/zabbix_agentd.conf
    zabbix_agent_include_dir: /etc/zabbix/zabbix_agentd.d
    package_check_script: /usr/local/bin/agent_pkg.sh
    package_check_config: "{{ zabbix_agent_include_dir }}/pkg.conf"
    package_cache_dir: /var/lib/zabbix

  pre_tasks:
    - name: Require the Zabbix Server address
      ansible.builtin.assert:
        that:
          - zabbix_server_ip | length > 0
        fail_msg: >-
          Set zabbix_server_ip in inventory/group_vars or pass it with
          -e zabbix_server_ip=<server-address>.

    - name: Check that the Zabbix agent service exists
      ansible.builtin.command:
        cmd: "systemctl cat {{ zabbix_agent_service }}"
      changed_when: false

  tasks:
    - name: Ensure Zabbix agent include directory exists
      ansible.builtin.file:
        path: "{{ zabbix_agent_include_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure package cache belongs to Zabbix
      ansible.builtin.file:
        path: "{{ package_cache_dir }}"
        state: directory
        owner: zabbix
        group: zabbix
        mode: "0755"
        recurse: true

    - name: Check for managed agent connection block
      ansible.builtin.command:
        cmd: "grep -q '^# BEGIN ANSIBLE PACKAGE CHECK CONNECTION$' {{ zabbix_agent_config }}"
      register: managed_connection_block
      changed_when: false
      failed_when: false

    - name: Remove old agent connection settings once
      ansible.builtin.replace:
        path: "{{ zabbix_agent_config }}"
        regexp: "(?m)^[[:space:]]*(Server|ServerActive|TLSAccept|TLSConnect)=.*\\n?"
        replace: ""
      notify: Validate and restart Zabbix agent
      when: managed_connection_block.rc != 0

    - name: Configure Zabbix agent connection
      ansible.builtin.blockinfile:
        path: "{{ zabbix_agent_config }}"
        marker: "# {mark} ANSIBLE PACKAGE CHECK CONNECTION"
        block: |
          Server={{ zabbix_server_ip }}
          ServerActive={{ zabbix_server_ip }}
          TLSAccept=unencrypted
          TLSConnect=unencrypted
      notify: Validate and restart Zabbix agent

    - name: Ensure Zabbix agent includes custom configuration
      ansible.builtin.lineinfile:
        path: "{{ zabbix_agent_config }}"
        regexp: "^Include={{ zabbix_agent_include_dir | regex_escape }}.*$"
        line: "Include={{ zabbix_agent_include_dir }}/*.conf"
        insertafter: EOF
      notify: Validate and restart Zabbix agent

    - name: Install package check script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/agent_pkg.sh"
        dest: "{{ package_check_script }}"
        owner: root
        group: root
        mode: "0755"
      notify: Validate and restart Zabbix agent

    - name: Install package check UserParameter
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/zabbix_agent_conf/pkg.conf"
        dest: "{{ package_check_config }}"
        owner: root
        group: root
        mode: "0644"
      notify: Validate and restart Zabbix agent

    - name: Ensure Zabbix agent is enabled and running
      ansible.builtin.service:
        name: "{{ zabbix_agent_service }}"
        state: started
        enabled: true

    - name: Apply pending agent changes
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Validate and restart Zabbix agent
      ansible.builtin.shell: |
        set -e
        zabbix_agentd -T -c "{{ zabbix_agent_config }}"
        systemctl restart "{{ zabbix_agent_service }}"
      args:
        executable: /bin/sh
