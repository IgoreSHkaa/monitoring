version: '3.8'

services:
  mysql-server:
    image: mysql:8.0
    container_name: zabbix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD_FILE: /run/secrets/MYSQL_PASSWORD
    secrets:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$(cat /run/secrets/MYSQL_ROOT_PASSWORD)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zabbix-net

  zabbix-java-gateway:
    image: zabbix/zabbix-java-gateway:alpine-7.0-latest
    container_name: zabbix-java-gateway
    restart: unless-stopped
    networks:
      - zabbix-net

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD_FILE: /run/secrets/MYSQL_PASSWORD
      ZBX_JAVAGATEWAY: zabbix-java-gateway
      ZBX_STARTREPORTWRITERS: "3"
      ZBX_WEBSERVICEURL: http://zabbix-web-service:10053/report
      ZBX_VALUECACHESIZE: "128M"
      ZBX_CACHESIZE: "64M"
      ZBX_HISTORYCACHESIZE: "32M"
      ZBX_TRENDCACHESIZE: "16M"
      ZBX_HISTORYSTORAGEURL: "string"
    secrets:
      - MYSQL_PASSWORD
    volumes:
      - zabbix-alertscripts:/usr/lib/zabbix/alertscripts
      - zabbix-externalscripts:/usr/lib/zabbix/externalscripts
      - zabbix-export:/var/lib/zabbix/export
      - zabbix-modules:/var/lib/zabbix/modules
      - zabbix-enc:/var/lib/zabbix/enc
      - zabbix-sshkeys:/var/lib/zabbix/ssh_keys
      - zabbix-mibs:/var/lib/zabbix/mibs
      - snmptraps:/var/lib/zabbix/snmptraps
    ports:
      - "10051:10051"
    depends_on:
      mysql-server:
        condition: service_healthy
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD_FILE: /run/secrets/MYSQL_PASSWORD
      PHP_TZ: "Europe/Moscow"
      ZBX_SERVER_NAME: "Zabbix Monitoring"
    secrets:
      - MYSQL_PASSWORD
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net

  zabbix-web-service:
    image: zabbix/zabbix-web-service:alpine-7.0-latest
    container_name: zabbix-web-service
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD_FILE: /run/secrets/MYSQL_PASSWORD
    secrets:
      - MYSQL_PASSWORD
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: "zabbix-server"
      ZBX_SERVER_HOST: zabbix-server
    ports:
      - "10050:10050"
    privileged: true
    pid: "host"
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - zabbix-net

networks:
  zabbix-net:
    driver: bridge

volumes:
  mysql-data:
  zabbix-alertscripts:
  zabbix-externalscripts:
  zabbix-export:
  zabbix-modules:
  zabbix-enc:
  zabbix-sshkeys:
  zabbix-mibs:
  snmptraps:

secrets:
  MYSQL_ROOT_PASSWORD:
    file: ./secrets/MYSQL_ROOT_PASSWORD.txt
  MYSQL_PASSWORD:
    file: ./secrets/MYSQL_PASSWORD.txt
